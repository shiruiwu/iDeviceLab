name: Build Alpha11 Rootless Core DEB

on:
  workflow_dispatch:
  push:
    branches:
      - mod-hw-alpha11
    paths:
      - 'mod_hw_for_ios_V2_alpha11/core/**'
      - 'mod_hw_for_ios_V2_alpha11/scripts/build-core-deb.sh'
      - '.github/workflows/build-alpha11-core-deb.yml'

permissions:
  contents: read

jobs:
  build-core:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mod_hw_for_ios_V2_alpha11
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Debian package verifier
        run: brew install dpkg ldid

      - name: Validate package scripts and plist
        run: |
          bash -n scripts/build-core-deb.sh
          plutil -lint core/layout/Library/LaunchDaemons/com.idevelab.core.alpha11.plist
          plutil -lint core/layout/Library/LaunchDaemons/com.idevelab.maintenance.alpha11.plist
          sh -n core/layout/DEBIAN/postinst
          sh -n core/layout/DEBIAN/prerm
          sh -n core/layout/DEBIAN/postrm

      - name: Build Core DEB
        run: bash scripts/build-core-deb.sh

      - name: Verify DEB metadata and payload
        run: |
          set -euo pipefail
          DEB=release/idevelab-core-alpha11.deb
          test -s "$DEB"
          ar t "$DEB"
          dpkg-deb -f "$DEB" Package | grep -Fx 'com.idevelab.core.alpha11'
          dpkg-deb -f "$DEB" Version | grep -Fx '0.3.2~alpha11'
          dpkg-deb -f "$DEB" Architecture | grep -Fx 'iphoneos-arm64'
          dpkg-deb -c "$DEB" | grep -F 'var/jb/usr/libexec/idevelab-core'
          echo "Core signing tool: $(ldid -h 2>&1 | head -n 1)"
          dpkg-deb -c "$DEB" | grep -F 'var/jb/Library/LaunchDaemons/com.idevelab.core.alpha11.plist'
          dpkg-deb -e "$DEB" build/core-control
          sh -n build/core-control/postinst
          grep -F 'Using launchctl:' build/core-control/postinst
          echo "Core package verified."

      - name: Upload Core DEB
        uses: actions/upload-artifact@v4
        with:
          name: idevelab-core-alpha11-build15
          path: mod_hw_for_ios_V2_alpha11/release/idevelab-core-alpha11.deb
          if-no-files-found: error
          retention-days: 14
