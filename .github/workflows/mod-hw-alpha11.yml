name: Build mod_hw Alpha11 TrollStore IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'mod_hw_for_ios_V2_alpha11/**'
      - '.github/workflows/mod-hw-alpha11.yml'

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mod_hw_for_ios_V2_alpha11
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Sync complete upstream source snapshot
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/dengtao1st/mod_hw_for_ios.git "$RUNNER_TEMP/mod_hw_upstream"
          rsync -a --exclude='.git' "$RUNNER_TEMP/mod_hw_upstream/" ./
          cat > Makefile <<'MAKEFILE'
          ARCHS = arm64
          TARGET = iphone:clang:latest:14.0
          THEOS_PACKAGE_SCHEME = rootless
          INSTALL_TARGET_PROCESSES = SpringBoard
          include $(THEOS)/makefiles/common.mk
          TWEAK_NAME = mod_hw_for_ios
          mod_hw_for_ios_FILES = src/mobile_gestalt/mobile_gestalt.m src/cydia_substrate_hook/HookUtil.m src/captain_hook/hook.mm
          mod_hw_for_ios_CFLAGS = -fno-objc-arc -I$(THEOS_PROJECT_DIR)/src -I$(THEOS_PROJECT_DIR)/src/third_party
          mod_hw_for_ios_CCFLAGS = -std=c++17 -fno-objc-arc -I$(THEOS_PROJECT_DIR)/src -I$(THEOS_PROJECT_DIR)/src/third_party
          mod_hw_for_ios_FRAMEWORKS = Foundation CoreFoundation CoreTelephony Security SystemConfiguration
          mod_hw_for_ios_LIBRARIES = substrate
          include $(THEOS_MAKE_PATH)/tweak.mk
          MAKEFILE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Sync complete upstream source into Alpha11 [skip ci]"
            git push origin "HEAD:mod-hw-alpha11"
          fi

      - name: Run static project checks
        run: python3 tools/validate_project.py

      - name: Check Swift and build script syntax
        run: |
          swiftc -frontend -parse manager/ModHWManager/ModHWManagerApp.swift
          bash -n scripts/build-trollstore-ipa.sh
          bash -n scripts/install-config.sh
          bash -n scripts/build-release.sh

      - name: Build unsigned TrollStore IPA
        run: bash scripts/build-trollstore-ipa.sh

      - name: Verify IPA package
        run: |
          test -s release/mod_hw_manager_trollstore.ipa
          unzip -t release/mod_hw_manager_trollstore.ipa
          unzip -l release/mod_hw_manager_trollstore.ipa | grep -E 'Payload/ModHWManager.app/Info.plist$'
          unzip -l release/mod_hw_manager_trollstore.ipa | grep -E 'Payload/ModHWManager.app/[^/]+$'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-hw-manager-trollstore-ipa
          path: mod_hw_for_ios_V2_alpha11/release/mod_hw_manager_trollstore.ipa
          if-no-files-found: error
          retention-days: 14
