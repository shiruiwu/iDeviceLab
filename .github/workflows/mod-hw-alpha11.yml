name: Build mod_hw Alpha11 TrollStore IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'mod_hw_for_ios_V2_alpha11/**'
      - '.github/workflows/mod-hw-alpha11.yml'

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mod_hw_for_ios_V2_alpha11
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version


      - name: Run static project checks
        run: python3 tools/validate_project.py

      - name: Compile Alpha11 Core and privileged helpers against the iOS SDK
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for source in core/main.m core/maintenance_helper.m core/manager_pair.m; do
            xcrun --sdk iphoneos clang -fsyntax-only -target arm64-apple-ios16.0 -isysroot "$SDK" -fobjc-arc -Wall -Wextra -framework Foundation "$source"
          done

      - name: Check Swift and shell syntax
        run: |
          swiftc -frontend -parse manager/ModHWManager/ModHWManagerApp.swift
          bash -n scripts/build-trollstore-ipa.sh
          bash -n scripts/diagnose-config.sh
          bash -n scripts/backup-config.sh
          bash -n scripts/restore-config.sh
          bash -n scripts/backup-app-container.sh
          bash -n scripts/restore-app-container.sh
          bash -n scripts/cleanup-app-container.sh
          bash -n scripts/verify-app-container-backup.sh
          bash -n scripts/selftest-device.sh
          sh -n scripts/acceptance-iphone12.sh
          bash -n scripts/diagnose-keychain-access.sh
          bash -n scripts/build-release.sh
          bash -n scripts/build-diagnostics-deb.sh
          bash -n scripts/build-core-deb.sh
          sh -n scripts/maintenance-dispatch.sh
          sh -n core/layout/DEBIAN/postinst
          sh -n core/layout/DEBIAN/prerm

      - name: Build unsigned TrollStore IPA
        run: bash scripts/build-trollstore-ipa.sh

      - name: Verify IPA package
        run: |
          test -s release/mod_hw_manager_trollstore.ipa
          unzip -t release/mod_hw_manager_trollstore.ipa
          unzip -l release/mod_hw_manager_trollstore.ipa | grep -E 'Payload/ModHWManager.app/Info.plist$'
          unzip -l release/mod_hw_manager_trollstore.ipa | grep -E 'Payload/ModHWManager.app/[^/]+$'

      - name: Build rootless config and app-backup tools DEB
        run: bash scripts/build-diagnostics-deb.sh

      - name: Verify DEB package structure
        run: |
          test -s release/mod_hw_for_ios_V2_diagnostics_FINAL.deb
          python3 - <<'PY'
          import io, tarfile
          package = 'release/mod_hw_for_ios_V2_diagnostics_FINAL.deb'
          raw = open(package, 'rb').read()
          print('CORE_DEB_MAGIC_CHECK_V2', raw[:8].hex())
          assert raw[:8].hex() == '213c617263683e0a', raw[:8].hex()
          members, offset = {}, 8
          while offset < len(raw):
              header = raw[offset:offset + 60]
              assert len(header) == 60 and header[58:60] == bytes((96, 10)), repr(header[58:60])
              name = header[:16].decode('ascii').strip().rstrip('/')
              size = int(header[48:58].decode('ascii').strip())
              start = offset + 60
              members[name] = raw[start:start + size]
              offset = start + size + (size % 2)
          assert set(members) == {'debian-binary', 'control.tar.gz', 'data.tar.gz'}, sorted(members)
          with tarfile.open(fileobj=io.BytesIO(members['control.tar.gz']), mode='r:gz') as archive:
              control_member = next(m for m in archive.getmembers() if m.name.lstrip('./') == 'control')
              metadata = archive.extractfile(control_member).read().decode()
          assert 'Architecture: iphoneos-arm64' in metadata, metadata
          assert 'Depends: coreutils' in metadata and 'procps' not in metadata, metadata
          with tarfile.open(fileobj=io.BytesIO(members['data.tar.gz']), mode='r:gz') as archive:
              installed = {m.name.lstrip('./') for m in archive.getmembers()}
          expected = {
              'var/jb/usr/bin/mod-hw-diagnose',
              'var/jb/usr/bin/mod-hw-config-backup',
              'var/jb/usr/bin/mod-hw-config-restore',
              'var/jb/usr/bin/mod-hw-app-backup',
              'var/jb/usr/bin/mod-hw-app-restore',
              'var/jb/usr/bin/mod-hw-app-clean',
              'var/jb/usr/bin/mod-hw-app-backup-verify',
              'var/jb/usr/bin/mod-hw-selftest',
              'var/jb/usr/bin/mod-hw-acceptance-iphone12',
              'var/jb/usr/bin/mod-hw-keychain-diagnose',
              'var/jb/usr/bin/mod-hw-maintenance',
          }
          assert expected.issubset(installed), sorted(installed)
          print('DEB ar members, architecture, dependency, and all eleven installed tools verified')
          PY

      - name: Build Alpha11 Core rootless DEB
        run: bash scripts/build-core-deb.sh

      - name: Verify Core DEB and LaunchDaemon payload
        run: |
          python3 - <<'PY'
          import io, plistlib, tarfile
          package = 'release/idevelab-core-alpha11.deb'
          raw = open(package, 'rb').read()
          print('CORE_PACKAGE_MAGIC_CHECK_V3', raw[:8].hex())
          assert raw[:8].hex() == '213c617263683e0a', raw[:8].hex()
          members, offset = {}, 8
          while offset < len(raw):
              header = raw[offset:offset + 60]
              assert len(header) == 60 and header[58:60] == bytes((96, 10)), repr(header[58:60])
              name = header[:16].decode('ascii').strip().rstrip('/')
              size = int(header[48:58].decode('ascii').strip())
              start = offset + 60
              members[name] = raw[start:start + size]
              offset = start + size + (size % 2)
          assert set(members) == {'debian-binary', 'control.tar.gz', 'data.tar.gz'}, sorted(members)
          with tarfile.open(fileobj=io.BytesIO(members['control.tar.gz']), mode='r:gz') as archive:
              control = next(m for m in archive.getmembers() if m.name.lstrip('./') == 'control')
              metadata = archive.extractfile(control).read().decode()
              control_files = {m.name.lstrip('./'): m for m in archive.getmembers()}
              assert 'postinst' in control_files and 'prerm' in control_files and 'postrm' in control_files
              for hook in ('postinst', 'prerm', 'postrm'):
                  assert archive.extractfile(control_files[hook]).read().startswith(b'#!/bin/sh')
          assert 'Package: com.idevelab.core.alpha11' in metadata
          assert 'Architecture: iphoneos-arm64' in metadata
          assert 'Depends: firmware (>= 15.0), com.modhw.ios.diagnostics' in metadata
          with tarfile.open(fileobj=io.BytesIO(members['data.tar.gz']), mode='r:gz') as archive:
              files = {m.name.lstrip('./'): m for m in archive.getmembers()}
              binary_path = 'var/jb/usr/libexec/idevelab-core'
              plist_path = 'var/jb/Library/LaunchDaemons/com.idevelab.core.alpha11.plist'
              helper_plist_path = 'var/jb/Library/LaunchDaemons/com.idevelab.maintenance.alpha11.plist'
              assert binary_path in files and plist_path in files and helper_plist_path in files, sorted(files)
              assert 'var/jb/usr/bin/mod-hw-maintenance-helper' in files and 'var/jb/usr/bin/mod-hw-manager-pair' in files
              binary = archive.extractfile(files[binary_path]).read()
              assert binary[:4] == bytes.fromhex('cffaedfe'), binary[:4].hex()
              plist = plistlib.loads(archive.extractfile(files[plist_path]).read())
              assert plist['Label'] == 'com.idevelab.core.alpha11'
              assert plist['ProgramArguments'] == ['/var/jb/usr/libexec/idevelab-core']
              assert plist['UserName'] == 'mobile' and plist['GroupName'] == 'mobile'
              helper_plist = plistlib.loads(archive.extractfile(files[helper_plist_path]).read())
              assert helper_plist['Label'] == 'com.idevelab.maintenance.alpha11'
              assert helper_plist['ProgramArguments'] == ['/var/jb/usr/bin/mod-hw-maintenance-helper']
              assert helper_plist['UserName'] == 'root' and helper_plist['GroupName'] == 'wheel'
              for helper_path in ('var/jb/usr/bin/mod-hw-maintenance-helper', 'var/jb/usr/bin/mod-hw-manager-pair'):
                  helper_binary = archive.extractfile(files[helper_path]).read()
                  assert helper_binary[:4] == bytes.fromhex('cffaedfe'), (helper_path, helper_binary[:4].hex())
          print('Core DEB, arm64 Core and Root Helper binaries, rootless paths, and both LaunchDaemons verified')
          PY

      - name: Upload IPA, Core, and diagnostics DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-hw-v2-final-safe-builds
          path: |
            mod_hw_for_ios_V2_alpha11/release/mod_hw_manager_trollstore.ipa
            mod_hw_for_ios_V2_alpha11/release/idevelab-core-alpha11.deb
            mod_hw_for_ios_V2_alpha11/release/mod_hw_for_ios_V2_diagnostics_FINAL.deb
          if-no-files-found: error
          retention-days: 14
