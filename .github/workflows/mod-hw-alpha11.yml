name: Build mod_hw Alpha11 TrollStore IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'mod_hw_for_ios_V2_alpha11/**'
      - '.github/workflows/mod-hw-alpha11.yml'

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mod_hw_for_ios_V2_alpha11
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version


      - name: Run static project checks
        run: python3 tools/validate_project.py

      - name: Check Swift and shell syntax
        run: |
          swiftc -frontend -parse manager/ModHWManager/ModHWManagerApp.swift
          bash -n scripts/build-trollstore-ipa.sh
          bash -n scripts/diagnose-config.sh
          bash -n scripts/backup-config.sh
          bash -n scripts/restore-config.sh
          bash -n scripts/backup-app-container.sh
          bash -n scripts/verify-app-container-backup.sh
          bash -n scripts/build-release.sh
          bash -n scripts/build-diagnostics-deb.sh

      - name: Build unsigned TrollStore IPA
        run: bash scripts/build-trollstore-ipa.sh

      - name: Verify IPA package
        run: |
          test -s release/mod_hw_manager_trollstore.ipa
          unzip -t release/mod_hw_manager_trollstore.ipa
          unzip -l release/mod_hw_manager_trollstore.ipa | grep -E 'Payload/ModHWManager.app/Info.plist$'
          unzip -l release/mod_hw_manager_trollstore.ipa | grep -E 'Payload/ModHWManager.app/[^/]+$'

      - name: Build rootless config and app-backup tools DEB
        run: bash scripts/build-diagnostics-deb.sh

      - name: Verify DEB package structure
        run: |
          test -s release/mod_hw_for_ios_V2_diagnostics_FINAL.deb
          python3 - <<'PY'
          import io, subprocess, tarfile
          package = 'release/mod_hw_for_ios_V2_diagnostics_FINAL.deb'
          p = subprocess.run(['ar', 't', package], check=True, text=True, capture_output=True)
          names = [n.rstrip('/') for n in p.stdout.splitlines()]
          assert names == ['debian-binary', 'control.tar.gz', 'data.tar.gz'], names
          control = subprocess.run(['ar', 'p', package, 'control.tar.gz'], check=True, capture_output=True).stdout
          with tarfile.open(fileobj=io.BytesIO(control), mode='r:gz') as archive:
              metadata = archive.extractfile('./control').read().decode()
          assert 'Architecture: iphoneos-arm64' in metadata, metadata
          data = subprocess.run(['ar', 'p', package, 'data.tar.gz'], check=True, capture_output=True).stdout
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              members = {m.name.lstrip('./') for m in archive.getmembers()}
          expected = {
              'var/jb/usr/bin/mod-hw-diagnose',
              'var/jb/usr/bin/mod-hw-config-backup',
              'var/jb/usr/bin/mod-hw-config-restore',
              'var/jb/usr/bin/mod-hw-app-backup',
              'var/jb/usr/bin/mod-hw-app-backup-verify',
          }
          assert expected.issubset(members), sorted(members)
          print('DEB ar members, architecture, and all five installed tools verified')
          PY

      - name: Upload IPA and diagnostics DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-hw-v2-final-safe-builds
          path: |
            mod_hw_for_ios_V2_alpha11/release/mod_hw_manager_trollstore.ipa
            mod_hw_for_ios_V2_alpha11/release/mod_hw_for_ios_V2_diagnostics_FINAL.deb
          if-no-files-found: error
          retention-days: 14
