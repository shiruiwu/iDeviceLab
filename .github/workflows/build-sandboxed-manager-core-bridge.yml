name: Build Sandboxed Manager Core Bridge IPA

on:
  workflow_dispatch:
  push:
    branches:
      - mod-hw-alpha11
    paths:
      - 'mod_hw_for_ios_V2_alpha11/manager/**'
      - 'mod_hw_for_ios_V2_alpha11/scripts/build-manager-sandboxed-ipa.sh'
      - '.github/workflows/build-sandboxed-manager-core-bridge.yml'

permissions:
  contents: read

jobs:
  build-sandboxed-manager:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mod_hw_for_ios_V2_alpha11
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode and install ldid
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install ldid

      - name: Parse Manager Swift sources
        run: find manager -name '*.swift' -print0 | xargs -0 -n1 swiftc -frontend -parse

      - name: Build sandboxed Manager Build16
        run: |
          bash -n scripts/build-manager-sandboxed-ipa.sh
          bash scripts/build-manager-sandboxed-ipa.sh

      - name: Verify sandboxed IPA identity and entitlements
        run: |
          set -euo pipefail
          IPA=release/mod_hw_manager_sandboxed_build16.ipa
          test -s "$IPA"
          unzip -t "$IPA"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          unzip -q "$IPA" -d "$TMP"
          APP="$TMP/Payload/ModHWManager.app"
          INFO="$APP/Info.plist"
          test -s "$INFO"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")" = "com.modhw.manager.sandboxed"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")" = "16"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$INFO")" = "16.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' "$INFO")" = "true"
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")"
          file "$BIN" | grep -q Mach-O
          lipo "$BIN" -verify_arch arm64
          ldid -e "$BIN" > "$TMP/entitlements.plist"
          python3 - "$TMP/entitlements.plist" <<'PY'
          import plistlib,sys
          with open(sys.argv[1],"rb") as f: e=plistlib.load(f)
          assert not e.get("com.apple.private.security.no-sandbox",False),e
          assert not e.get("platform-application",False),e
          print("Sandboxed Build16 entitlements verified")
          PY

      - name: Upload sandboxed Manager IPA
        uses: actions/upload-artifact@v4
        with:
          name: mod-hw-manager-sandboxed-build16-core-bridge
          path: mod_hw_for_ios_V2_alpha11/release/mod_hw_manager_sandboxed_build16.ipa
          if-no-files-found: error
          retention-days: 14
