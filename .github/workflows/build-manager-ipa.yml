name: Build Manager TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches:
      - mod-hw-alpha11

permissions:
  contents: read

concurrency:
  group: manager-ipa-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build-manager:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mod_hw_for_ios_V2_alpha11
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Parse all Manager Swift sources
        run: |
          find manager -name '*.swift' -print0 | xargs -0 -n1 swiftc -frontend -parse

      - name: Check build script syntax
        run: |
          bash -n scripts/build-trollstore-ipa.sh
          bash -n scripts/build-startup-probe-ipa.sh
          bash -n scripts/build-manager-sandboxed-ipa.sh

      - name: Build sandboxed UIKit startup control
        run: bash scripts/build-startup-probe-ipa.sh

      - name: Build sandboxed full Manager diagnostic IPA
        run: bash scripts/build-manager-sandboxed-ipa.sh

      - name: Build Release iOS Simulator smoke-test app
        run: |
          set -euo pipefail
          xcodebuild -project manager/ModHWManager.xcodeproj -scheme ModHWManager -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
          test -d build/simulator/Build/Products/Release-iphonesimulator/ModHWManager.app

      - name: Upload Manager diagnostic IPAs before simulator smoke test
        uses: actions/upload-artifact@v4
        with:
          name: mod-hw-manager-real-device-diagnostic-ipas
          path: |
            mod_hw_for_ios_V2_alpha11/build/manager-sandboxed-startup-control.ipa
            mod_hw_for_ios_V2_alpha11/build/manager-sandboxed-full-diagnostic.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Launch Release app and capture runtime diagnostics
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["isAvailable"] and x["name"].startswith("iPhone")))' )"
          echo "Simulator UDID: $DEVICE_ID" | tee build/diagnostics/simulator.txt
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/simulator/Build/Products/Release-iphonesimulator/ModHWManager.app
          xcrun simctl launch "$DEVICE_ID" com.modhw.manager --idevelab-ci-full-manager 2>&1 | tee build/diagnostics/launch.txt
          sleep 12
          xcrun simctl io "$DEVICE_ID" screenshot build/diagnostics/manager-full-ui.png
          sleep 18
          # terminate returns non-zero if the full SwiftUI manager has exited or crashed.
          xcrun simctl terminate "$DEVICE_ID" com.modhw.manager
          # Capture broad simulator diagnostics before filtering: the process may
          # have exited or been renamed by SpringBoard before the old predicate ran.
          xcrun simctl spawn "$DEVICE_ID" log show --last 5m --style compact > build/diagnostics/system-runtime.log 2>&1 || true
          log show --last 5m --style compact --predicate 'process CONTAINS[c] "ModHWManager" OR eventMessage CONTAINS[c] "ModHWManager" OR eventMessage CONTAINS[c] "com.modhw.manager"' > build/diagnostics/manager-runtime.log 2>&1 || true
          xcrun simctl spawn "$DEVICE_ID" launchctl list > build/diagnostics/launchctl-list.txt 2>&1 || true
          mkdir -p build/diagnostics/crash-reports
          xcrun simctl get_app_container "$DEVICE_ID" com.modhw.manager data > build/diagnostics/app-data-container.txt 2>&1 || true
          xcrun simctl spawn "$DEVICE_ID" ls -lt /var/mobile/Library/Logs/CrashReporter > build/diagnostics/crash-reports/list.txt 2>&1 || true

      - name: Verify sandboxed Manager Build19
        run: |
          set -euo pipefail
          IPA=release/mod_hw_manager_sandboxed_build19.ipa
          test -s "$IPA"
          unzip -t "$IPA"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          unzip -q "$IPA" -d "$TMP"
          APP="$TMP/Payload/ModHWManager.app"
          test -s "$APP/Info.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          test "$BUNDLE_ID" = "com.modhw.manager.sandboxed"
          test "$BUILD" = "19"
          test "$MIN_OS" = "16.0"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          file "$APP/$EXECUTABLE" | grep -q Mach-O
          lipo "$APP/$EXECUTABLE" -verify_arch arm64
          ldid -e "$APP/$EXECUTABLE" > "$TMP/sandboxed-entitlements.plist"
          python3 - "$TMP/sandboxed-entitlements.plist" <<'PY'
          import plistlib,sys
          data=open(sys.argv[1],"rb").read()
          # A normally sandboxed app may have no custom entitlements at all.
          e=plistlib.loads(data) if data else {}
          assert not e.get("com.apple.private.security.no-sandbox",False),e
          assert not e.get("platform-application",False),e
          assert e.get("com.apple.security.application-groups") == ["group.com.idevelab.manager"],e
          print("Sandboxed Build19 entitlements verified")
          PY

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-hw-manager-runtime-diagnostics
          path: mod_hw_for_ios_V2_alpha11/build/diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload sandboxed UIKit startup control IPA
        uses: actions/upload-artifact@v4
        with:
          name: mod-hw-manager-sandboxed-uikit-control-build13
          path: mod_hw_for_ios_V2_alpha11/release/mod_hw_manager_startup_probe_build13.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload sandboxed full Manager diagnostic IPA
        uses: actions/upload-artifact@v4
        with:
          name: mod-hw-manager-sandboxed-build19-app-group-bridge
          path: mod_hw_for_ios_V2_alpha11/release/mod_hw_manager_sandboxed_build19.ipa
          if-no-files-found: error
          retention-days: 14
