name: Build Manager TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches:
      - mod-hw-alpha11

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build-manager:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mod_hw_for_ios_V2_alpha11
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Parse all Manager Swift sources
        run: |
          find manager -name '*.swift' -print0 | xargs -0 -n1 swiftc -frontend -parse

      - name: Check build script syntax
        run: bash -n scripts/build-trollstore-ipa.sh

      - name: Build iOS Simulator smoke-test app
        run: |
          xcodebuild -project manager/ModHWManager.xcodeproj -scheme ModHWManager -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
          test -d build/simulator/Build/Products/Debug-iphonesimulator/ModHWManager.app

      - name: Launch app in iOS Simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["isAvailable"] and x["name"].startswith("iPhone")))' )"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/simulator/Build/Products/Debug-iphonesimulator/ModHWManager.app
          xcrun simctl launch "$DEVICE_ID" com.modhw.manager
          sleep 8
          xcrun simctl spawn "$DEVICE_ID" launchctl list | grep -F 'com.modhw.manager'
          xcrun simctl terminate "$DEVICE_ID" com.modhw.manager

      - name: Build TrollStore IPA
        run: bash scripts/build-trollstore-ipa.sh

      - name: Verify IPA structure and metadata
        run: |
          set -euo pipefail
          IPA=release/mod_hw_manager_trollstore.ipa
          test -s "$IPA"
          unzip -t "$IPA"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          unzip -q "$IPA" -d "$TMP"
          APP="$TMP/Payload/ModHWManager.app"
          test -s "$APP/Info.plist"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          test "$BUNDLE_ID" = "com.modhw.manager"
          test "$BUILD" = "10"
          test "$MIN_OS" = "16.0"
          test -s "$APP/$EXECUTABLE"
          file "$APP/$EXECUTABLE" | grep -q Mach-O
          lipo "$APP/$EXECUTABLE" -verify_arch arm64
          ldid -e "$APP/$EXECUTABLE" > "$TMP/entitlements.plist"
          python3 - "$TMP/entitlements.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              e = plistlib.load(f)
          assert e.get("com.apple.private.security.no-sandbox") is True, e
          assert not e.get("platform-application", False), e
          print("Entitlements verified")
          PY
          echo "Verified: bundle=$BUNDLE_ID build=$BUILD minOS=$MIN_OS arch=arm64"

      - name: Upload Manager IPA
        uses: actions/upload-artifact@v4
        with:
          name: mod-hw-manager-build10-diagnostic
          path: mod_hw_for_ios_V2_alpha11/release/mod_hw_manager_trollstore.ipa
          if-no-files-found: error
          retention-days: 14
