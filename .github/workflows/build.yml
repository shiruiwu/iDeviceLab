name: Build iDevice Lab and Rootless Core

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: iDeviceLab-2.0-source-v2/iDeviceLab-2.0
        run: xcodegen generate
      - name: Build iOS app
        working-directory: iDeviceLab-2.0-source-v2/iDeviceLab-2.0
        run: |
          xcodebuild \
            -project iDeviceLab.xcodeproj \
            -scheme iDeviceLab \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Ad-hoc sign and verify app
        working-directory: iDeviceLab-2.0-source-v2/iDeviceLab-2.0
        run: |
          APP="build/Build/Products/Release-iphoneos/iDeviceLab.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -x "$APP/iDeviceLab"
          # Create a local ad-hoc signature; TrollStore can then apply its own
          # CoreTrust signing during installation. No developer certificate is used.
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Package IPA
        working-directory: iDeviceLab-2.0-source-v2/iDeviceLab-2.0
        run: |
          rm -rf Payload iDeviceLab.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/iDeviceLab.app Payload/
          /usr/bin/zip -qry iDeviceLab-unsigned.ipa Payload
          unzip -t iDeviceLab-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: iDeviceLab-trollstore-ipa
          path: iDeviceLab-2.0-source-v2/iDeviceLab-2.0/iDeviceLab-unsigned.ipa

  rootless:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install ldid dpkg
      - name: Bootstrap Theos and iOS SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          ln -s "$SDK_PATH" "$HOME/theos/sdks/iPhoneOS${SDK_VERSION}.sdk"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build Rootless package
        working-directory: iDeviceLab-2.0-source-v2/iDeviceLab-2.0/JailbreakCore
        run: |
          export THEOS="$HOME/theos"
          export THEOS_PACKAGE_SCHEME=rootless
          make package
      - uses: actions/upload-artifact@v4
        with:
          name: iDeviceLab-rootless-deb
          path: iDeviceLab-2.0-source-v2/iDeviceLab-2.0/JailbreakCore/packages/*.deb
