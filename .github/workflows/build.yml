name: Build iDevice Lab and Rootless Core

concurrency:
  group: idevice-lab-main-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main, master, device-manager-pro-full ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: iDeviceLab-2.0-source-v2/iDeviceLab-2.0
        run: xcodegen generate
      - name: Build iOS app
        working-directory: iDeviceLab-2.0-source-v2/iDeviceLab-2.0
        run: |
          xcodebuild \
            -project iDeviceLab.xcodeproj \
            -scheme iDeviceLab \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Ad-hoc sign and verify app
        working-directory: iDeviceLab-2.0-source-v2/iDeviceLab-2.0
        run: |
          APP="build/Build/Products/Release-iphoneos/iDeviceLab.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -x "$APP/iDeviceLab"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Package IPA
        working-directory: iDeviceLab-2.0-source-v2/iDeviceLab-2.0
        run: |
          rm -rf Payload iDeviceLab-trollstore.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/iDeviceLab.app Payload/
          /usr/bin/zip -qry iDeviceLab-trollstore.ipa Payload
          unzip -t iDeviceLab-trollstore.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: iDeviceLab-trollstore-ipa
          path: iDeviceLab-2.0-source-v2/iDeviceLab-2.0/iDeviceLab-trollstore.ipa
          retention-days: 90

  rootless:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install ldid dpkg
      - name: Bootstrap Theos and iOS SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          ln -s "$SDK_PATH" "$HOME/theos/sdks/iPhoneOS${SDK_VERSION}.sdk"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Validate Rootless Core and local plist bridge
        run: python3 tools/validate_rootless_core.py
      - name: Build Rootless package
        working-directory: iDeviceLab-2.0-source-v2/iDeviceLab-2.0/JailbreakCore
        run: |
          export THEOS="$HOME/theos"
          export THEOS_PACKAGE_SCHEME=rootless
          make package FINALPACKAGE=1
          PACKAGE="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$PACKAGE"
          dpkg-deb --info "$PACKAGE"
          dpkg-deb --contents "$PACKAGE" | tee package-contents.txt
          grep -F 'idevelab-core' package-contents.txt
          grep -F 'com.idevelab.core.plist' package-contents.txt
          dpkg-deb --ctrl-tarfile "$PACKAGE" | tar -tzf - | tee package-control-files.txt
          grep -E '(^|/)postinst$' package-control-files.txt
          grep -E '(^|/)prerm$' package-control-files.txt
          test "$(dpkg-deb -f "$PACKAGE" Package)" = "com.idevelab.core"
          test "$(dpkg-deb -f "$PACKAGE" Version)" = "0.1.6"
      - uses: actions/upload-artifact@v4
        with:
          name: iDeviceLab-rootless-deb
          path: iDeviceLab-2.0-source-v2/iDeviceLab-2.0/JailbreakCore/packages/*.deb
          if-no-files-found: error
          retention-days: 90
