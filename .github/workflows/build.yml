
name: Build iDevice Lab IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: iDeviceLab-2.0-source-v2/iDeviceLab-2.0
        run: xcodegen generate

      - name: Build iOS app
        working-directory: iDeviceLab-2.0-source-v2/iDeviceLab-2.0
        run: |
          xcodebuild \
            -project iDeviceLab.xcodeproj \
            -scheme iDeviceLab \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        working-directory: iDeviceLab-2.0-source-v2/iDeviceLab-2.0
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/iDeviceLab.app Payload/
          zip -r iDeviceLab-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: iDeviceLab-unsigned-ipa
          path: iDeviceLab-2.0-source-v2/iDeviceLab-2.0/iDeviceLab-unsigned.ipa
