name: Manual Alpha11 upstream source audit (no tweak package)

on:
  workflow_dispatch:
  push:
    branches: [ main, master, device-manager-pro-full ]
    paths:
      - 'mod_hw_for_ios_V2_alpha11/**'
      - '.github/workflows/build-theos-tweak.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mod_hw_for_ios_V2_alpha11
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift tools
        run: xcodebuild -version
      - name: Validate retained upstream source and safe companion
        run: python3 tools/validate_project.py
      - name: Parse companion manager and scripts
        run: |
          swiftc -frontend -parse manager/ModHWManager/ModHWManagerApp.swift
          bash -n scripts/build-trollstore-ipa.sh
          bash -n scripts/diagnose-config.sh
          bash -n scripts/build-release.sh
          bash -n scripts/build-diagnostics-deb.sh
      - name: Confirm optional cloud hook is excluded from package recipe
        run: |
          ! grep -F 'src/captain_hook/hook.mm' Makefile
          grep -F 'src/mobile_gestalt/mobile_gestalt.m' Makefile
          grep -F 'src/cydia_substrate_hook/HookUtil.m' Makefile
          echo "Source audit only: no runtime tweak DEB is built or uploaded."
