name: Build mod_hw Alpha11 Theos tweak

on:
  workflow_dispatch:
  push:
    paths:
      - 'mod_hw_for_ios_V2_alpha11/**'
      - '.github/workflows/build-theos-tweak.yml'

permissions:
  contents: read

concurrency:
  group: mod-hw-alpha11-theos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tweak:
    runs-on: macos-15-intel
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mod_hw_for_ios_V2_alpha11
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          brew install ldid dpkg

      - name: Install Theos and iOS SDKs
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          rsync -a "$RUNNER_TEMP/theos-sdks/" "$GITHUB_WORKSPACE/theos/sdks/"
          test -d "$GITHUB_WORKSPACE/theos/sdks"
          find "$GITHUB_WORKSPACE/theos/sdks" -maxdepth 1 -type d -name 'iPhoneOS*.sdk' -print | head -5
          test -n "$(find "$GITHUB_WORKSPACE/theos/sdks" -maxdepth 1 -type d -name 'iPhoneOS*.sdk' -print -quit)"

      - name: Build Rootless tweak package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1
          PACKAGE="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$PACKAGE"
          dpkg-deb --info "$PACKAGE"
          dpkg-deb --contents "$PACKAGE"

      - name: Build Alpha11 read-only Core package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          chmod 0755 core/layout/DEBIAN/postinst core/layout/DEBIAN/prerm
          make -C core clean package FINALPACKAGE=1
          CORE_PACKAGE="$(find core/packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$CORE_PACKAGE"
          dpkg-deb --info "$CORE_PACKAGE"
          dpkg-deb --contents "$CORE_PACKAGE" | grep -F 'var/jb/usr/libexec/idevelab-core'
          dpkg-deb --contents "$CORE_PACKAGE" | grep -F 'var/jb/Library/LaunchDaemons/com.idevelab.core.alpha11.plist'
          dpkg-deb -e "$CORE_PACKAGE" "$RUNNER_TEMP/alpha11-core-control"
          test -x "$RUNNER_TEMP/alpha11-core-control/postinst"
          test -x "$RUNNER_TEMP/alpha11-core-control/prerm"

      - name: Upload Rootless Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: mod-hw-alpha11-rootless-debs
          path: |
            mod_hw_for_ios_V2_alpha11/packages/*.deb
            mod_hw_for_ios_V2_alpha11/core/packages/*.deb
          if-no-files-found: error
          retention-days: 14
