name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Run project checks
        run: |
          swiftc -frontend -parse manager/ModHWManager/ModHWManagerApp.swift
          bash -n scripts/build-trollstore-ipa.sh

      - name: Build unsigned TrollStore IPA
        run: bash scripts/build-trollstore-ipa.sh

      - name: Verify IPA package
        run: |
          test -s release/mod_hw_manager_trollstore.ipa
          unzip -t release/mod_hw_manager_trollstore.ipa
          unzip -l release/mod_hw_manager_trollstore.ipa | grep -E 'Payload/ModHWManager.app/Info.plist$'
          unzip -l release/mod_hw_manager_trollstore.ipa | grep -E 'Payload/ModHWManager.app/[^/]+$'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-hw-manager-trollstore-ipa
          path: release/mod_hw_manager_trollstore.ipa
          if-no-files-found: error
          retention-days: 90
