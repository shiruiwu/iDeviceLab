name: iDeviceLab
options:
  bundleIdPrefix: com.idevelab
  deploymentTarget:
    iOS: "16.0"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

targets:
  iDeviceLab:
    type: application
    platform: iOS
    sources:
      - path: iDeviceLab
      - path: IPAEditor
    dependencies:
      - package: ZIPFoundation
    info:
      path: Generated/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idevelab.manager
        PRODUCT_NAME: iDeviceLab
        INFOPLIST_KEY_CFBundleDisplayName: iDevice Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGNING_ALLOWED: NO
